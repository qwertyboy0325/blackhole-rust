[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Orchestration, diagnostics, and Gate 1A evaluation"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
relativity-core = { path = "../crates/relativity-core" }
relativity-integrate = { path = "../crates/relativity-integrate" }
relativity-trace = { path = "../crates/relativity-trace" }
relativity-render = { path = "../crates/relativity-render" }
relativity-oracle = { path = "../crates/relativity-oracle" }
gate-1b0-ode-solvers = { path = "../spikes/gate-1b0-ode-solvers" }
gate-1b0-ivp = { path = "../spikes/gate-1b0-ivp" }
gate-1b0-contract = { path = "../spikes/gate-1b0-contract" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
exr = "1.74.2"
smallvec = "1.15.2"

[dev-dependencies]
tempfile = "3.27.0"
